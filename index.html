<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseñador de Circuitos y Cálculos Eléctricos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background-color: #121212; color: #e0e0e0; }
        
        /* Barra de Herramientas Superior */
        .toolbar { position: absolute; top: 20px; left: 300px; display: flex; gap: 10px; z-index: 10; }
        .btn-tool { background: #2a2a2a; color: white; border: 1px solid #444; padding: 10px 15px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .btn-tool.active { background: #4fc3f7; color: #000; border-color: #4fc3f7; }
        .btn-tool:hover:not(.active) { background: #383838; }

        /* Barra Lateral */
        aside { width: 280px; background-color: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 20px; gap: 20px; z-index: 5;}
        h2 { font-size: 1.1rem; color: #4fc3f7; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px;}
        
        .component-list { display: flex; flex-direction: column; gap: 10px; }
        .item-palette { background-color: #2a2a2a; border: 1px solid #444; padding: 12px; border-radius: 6px; cursor: grab; text-align: center; font-weight: 500; transition: background 0.2s; }
        .item-palette:hover { background-color: #383838; border-color: #4fc3f7; }
        
        /* Panel de Propiedades */
        .properties-panel { background-color: #252525; padding: 15px; border-radius: 6px; border: 1px solid #444; font-size: 0.9rem; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;}
        .properties-panel label { font-size: 0.8rem; color: #aaa; margin-bottom: -5px;}
        .properties-panel input, .properties-panel select { background: #1a1a1a; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; width: 100%;}
        .properties-panel input:focus, .properties-panel select:focus { outline: none; border-color: #4fc3f7; }
        
        .result-box { margin-top: 10px; padding: 10px; background: #1a1a1a; border-radius: 4px; border-left: 4px solid #4fc3f7; }
        .result-box.alert { border-left-color: #ff5252; color: #ff5252; }

        /* Lienzo */
        main { flex-grow: 1; position: relative; background-color: #181818; }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    </style>
</head>
<body>

    <aside>
        <h2>Componentes</h2>
        <div class="component-list">
            <div class="item-palette" draggable="true" data-type="tablero" data-name="Tablero Principal" data-power="0" data-volt="220">⚡ Tablero Principal</div>
            <div class="item-palette" draggable="true" data-type="equipo" data-name="Tomacorriente" data-power="300" data-volt="120">🔌 Tomacorriente (300W)</div>
            <div class="item-palette" draggable="true" data-type="equipo" data-name="Luminaria LED" data-power="100" data-volt="120">💡 Luminaria (100W)</div>
            <div class="item-palette" draggable="true" data-type="equipo" data-name="Bomba de Agua" data-power="1100" data-volt="220">⚙️ Bomba de Agua (1.5 HP)</div>
            <div class="item-palette" draggable="true" data-type="equipo" data-name="Aire Acondicionado" data-power="2200" data-volt="220">❄️ Aire Acond. (2200W)</div>
        </div>

        <h2>Propiedades</h2>
        <div class="properties-panel" id="propertiesPanel">
            <p style="color: #888; text-align: center;">Selecciona un equipo o el centro de un cable.</p>
        </div>
    </aside>

    <main>
        <div class="toolbar">
            <button class="btn-tool active" id="btnCursor" onclick="setModo('cursor')">👆 Mover / Seleccionar</button>
            <button class="btn-tool" id="btnCable" onclick="setModo('cable')">⚡ Trazar Cable</button>
        </div>
        <canvas id="circuitCanvas"></canvas>
    </main>

    <script>
        const canvas = document.getElementById('circuitCanvas');
        const ctx = canvas.getContext('2d');
        const propertiesPanel = document.getElementById('propertiesPanel');

        // Escala física: 40 pixeles = 1 Metro
        const PIXELES_POR_METRO = 40; 
        const GRID_SIZE = 20;
        
        // Tabla de Resistencias de Cobre (Ohmios por Kilómetro) - Valores Típicos aproximados
        const RESISTENCIA_AWG = {
            "14": 8.28,
            "12": 5.21,
            "10": 3.27,
            "8": 2.06,
            "6": 1.29,
            "4": 0.81
        };

        // Estado Global
        let modoActual = 'cursor'; // 'cursor' | 'cable'
        let elementosCanvas = [];
        let cablesCanvas = [];
        let elementoSeleccionado = null; // Puede ser un equipo o un cable
        let arrastrandoPalette = null;
        
        // Variables de interacción
        let isDragging = false;
        let offsetDragX = 0, offsetDragY = 0;
        let cableTemp = null; // { origen: el, mouseX, mouseY }

        // Redimensionar Canvas
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            drawEscena();
        }
        window.addEventListener('resize', resizeCanvas);

        function setModo(modo) {
            modoActual = modo;
            document.getElementById('btnCursor').classList.toggle('active', modo === 'cursor');
            document.getElementById('btnCable').classList.toggle('active', modo === 'cable');
            seleccionar(null);
            drawEscena();
        }

        // --- SISTEMA DE DIBUJO ---
        function drawEscena() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Dibujar Cuadrícula
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += GRID_SIZE) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += GRID_SIZE) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 2. Dibujar Cables
            cablesCanvas.forEach(cable => {
                const cx1 = cable.origen.x + cable.origen.w / 2;
                const cy1 = cable.origen.y + cable.origen.h / 2;
                const cx2 = cable.destino.x + cable.destino.w / 2;
                const cy2 = cable.destino.y + cable.destino.h / 2;

                ctx.beginPath();
                ctx.moveTo(cx1, cy1);
                ctx.lineTo(cx2, cy2);
                ctx.strokeStyle = (elementoSeleccionado === cable) ? '#ffeb3b' : '#4CAF50';
                ctx.lineWidth = (elementoSeleccionado === cable) ? 4 : 2;
                ctx.stroke();

                // Dibujar un "nodo" en el centro del cable para poder seleccionarlo
                const midX = (cx1 + cx2) / 2;
                const midY = (cy1 + cy2) / 2;
                ctx.beginPath();
                ctx.arc(midX, midY, 6, 0, Math.PI * 2);
                ctx.fillStyle = (elementoSeleccionado === cable) ? '#ffeb3b' : '#4CAF50';
                ctx.fill();
            });

            // 3. Dibujar Cable Temporal (si estamos trazando uno)
            if (cableTemp) {
                const cx1 = cableTemp.origen.x + cableTemp.origen.w / 2;
                const cy1 = cableTemp.origen.y + cableTemp.origen.h / 2;
                ctx.beginPath();
                ctx.moveTo(cx1, cy1);
                ctx.lineTo(cableTemp.mouseX, cableTemp.mouseY);
                ctx.strokeStyle = '#ff9800';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]); // reset
            }

            // 4. Dibujar Equipos
            elementosCanvas.forEach(el => {
                ctx.fillStyle = (elementoSeleccionado === el) ? '#37474f' : '#2a2a2a';
                ctx.strokeStyle = (elementoSeleccionado === el) ? '#ffc107' : (el.type === 'tablero' ? '#f44336' : '#4fc3f7');
                ctx.lineWidth = 2;

                ctx.fillRect(el.x, el.y, el.w, el.h);
                ctx.strokeRect(el.x, el.y, el.w, el.h);

                ctx.fillStyle = '#ffffff';
                ctx.font = '12px sans-serif';
                ctx.fillText(el.name, el.x + 8, el.y + 24);
                
                if(el.type !== 'tablero') {
                    ctx.fillStyle = '#aaa';
                    ctx.font = '10px sans-serif';
                    ctx.fillText(`${el.power}W | ${el.volt}V`, el.x + 8, el.y + 42);
                }
            });
        }

        // --- ARRASTRAR DESDE LA PALETA (Drag & Drop HTML5) ---
        document.querySelectorAll('.item-palette').forEach(item => {
            item.addEventListener('dragstart', (e) => {
                arrastrandoPalette = {
                    type: e.target.dataset.type,
                    name: e.target.dataset.name,
                    power: parseFloat(e.target.dataset.power),
                    volt: parseFloat(e.target.dataset.volt)
                };
            });
        });

        canvas.addEventListener('dragover', (e) => e.preventDefault());
        canvas.addEventListener('drop', (e) => {
            e.preventDefault();
            if (!arrastrandoPalette) return;

            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / GRID_SIZE) * GRID_SIZE;
            const y = Math.floor((e.clientY - rect.top) / GRID_SIZE) * GRID_SIZE;

            const nuevo = {
                id: 'obj_' + Date.now(),
                tipoObjeto: 'equipo',
                type: arrastrandoPalette.type,
                name: arrastrandoPalette.name,
                power: arrastrandoPalette.power,
                volt: arrastrandoPalette.volt,
                x: x, y: y, w: 120, h: 50
            };

            elementosCanvas.push(nuevo);
            setModo('cursor');
            seleccionar(nuevo);
            arrastrandoPalette = null;
        });

        // --- EVENTOS DEL RATÓN EN EL CANVAS ---
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            // Buscar si clicamos un equipo
            const equipoClicado = elementosCanvas.slice().reverse().find(el => 
                mx >= el.x && mx <= el.x + el.w && my >= el.y && my <= el.y + el.h
            );

            if (modoActual === 'cursor') {
                if (equipoClicado) {
                    seleccionar(equipoClicado);
                    isDragging = true;
                    offsetDragX = mx - equipoClicado.x;
                    offsetDragY = my - equipoClicado.y;
                } else {
                    // Buscar si clicamos el centro de un cable
                    const cableClicado = cablesCanvas.find(c => {
                        const cx = (c.origen.x + c.origen.w/2 + c.destino.x + c.destino.w/2) / 2;
                        const cy = (c.origen.y + c.origen.h/2 + c.destino.y + c.destino.h/2) / 2;
                        return Math.hypot(cx - mx, cy - my) < 10; // 10px de margen de error
                    });
                    seleccionar(cableClicado || null);
                }
            } 
            else if (modoActual === 'cable') {
                if (equipoClicado) {
                    cableTemp = { origen: equipoClicado, mouseX: mx, mouseY: my };
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            if (modoActual === 'cursor' && isDragging && elementoSeleccionado && elementoSeleccionado.tipoObjeto === 'equipo') {
                // Mover ajustando al Grid
                elementoSeleccionado.x = Math.round((mx - offsetDragX) / GRID_SIZE) * GRID_SIZE;
                elementoSeleccionado.y = Math.round((my - offsetDragY) / GRID_SIZE) * GRID_SIZE;
                drawEscena();
                if(elementoSeleccionado) actualizarPanelPropiedades(); // Refrescar longitudes en vivo
            }
            else if (modoActual === 'cable' && cableTemp) {
                cableTemp.mouseX = mx;
                cableTemp.mouseY = my;
                drawEscena();
            }
        });

        window.addEventListener('mouseup', (e) => {
            isDragging = false;
            
            if (modoActual === 'cable' && cableTemp) {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;

                // Ver donde soltamos el cable
                const equipoDestino = elementosCanvas.slice().reverse().find(el => 
                    mx >= el.x && mx <= el.x + el.w && my >= el.y && my <= el.y + el.h
                );

                if (equipoDestino && equipoDestino !== cableTemp.origen) {
                    // Crear el cable final
                    cablesCanvas.push({
                        id: 'cab_' + Date.now(),
                        tipoObjeto: 'cable',
                        origen: cableTemp.origen,
                        destino: equipoDestino,
                        awg: "12", // Calibre por defecto
                        longitudManual: null // Por si el usuario quiere sobreescribir la longitud visual
                    });
                }
                cableTemp = null;
                setModo('cursor');
            }
        });

        // --- PANEL DE PROPIEDADES Y MOTOR ELÉCTRICO ---
        function seleccionar(obj) {
            elementoSeleccionado = obj;
            actualizarPanelPropiedades();
            drawEscena();
        }

        function actualizarPanelPropiedades() {
            const obj = elementoSeleccionado;
            
            if (!obj) {
                propertiesPanel.innerHTML = `<p style="color: #888; text-align: center;">Selecciona un equipo o el nodo de un cable.</p>`;
                return;
            }

            if (obj.tipoObjeto === 'equipo') {
                const corriente = obj.volt > 0 ? (obj.power / obj.volt).toFixed(2) : 0;
                propertiesPanel.innerHTML = `
                    <label>Nombre del Equipo</label>
                    <input type="text" id="propName" value="${obj.name}">
                    
                    ${obj.type !== 'tablero' ? `
                    <label>Potencia (Watts)</label>
                    <input type="number" id="propPower" value="${obj.power}">
                    
                    <label>Voltaje Operativo</label>
                    <select id="propVolt">
                        <option value="120" ${obj.volt === 120 ? 'selected' : ''}>120V (Fase-Neutro)</option>
                        <option value="220" ${obj.volt === 220 ? 'selected' : ''}>220V (Fase-Fase)</option>
                    </select>

                    <div class="result-box">
                        <strong>Corriente (I):</strong> ${corriente} Amp
                    </div>
                    ` : '<div class="result-box"><strong>Fuente de Poder Principal</strong></div>'}
                    <button class="btn-tool" style="margin-top:10px; background:#f44336; border:none;" onclick="eliminarSeleccionado()">🗑️ Eliminar</button>
                `;

                // Eventos de actualización
                document.getElementById('propName').addEventListener('input', e => { obj.name = e.target.value; drawEscena(); });
                if(obj.type !== 'tablero') {
                    document.getElementById('propPower').addEventListener('input', e => { obj.power = parseFloat(e.target.value) || 0; actualizarPanelPropiedades(); });
                    document.getElementById('propVolt').addEventListener('change', e => { obj.volt = parseFloat(e.target.value); actualizarPanelPropiedades(); });
                }

            } else if (obj.tipoObjeto === 'cable') {
                // CÁLCULOS ELÉCTRICOS DEL CABLE
                // 1. Calcular Longitud en metros (Distancia euclidiana entre centros)
                const cx1 = obj.origen.x + obj.origen.w/2; const cy1 = obj.origen.y + obj.origen.h/2;
                const cx2 = obj.destino.x + obj.destino.w/2; const cy2 = obj.destino.y + obj.destino.h/2;
                const pixeles = Math.hypot(cx2 - cx1, cy2 - cy1);
                const metrosCalculados = (pixeles / PIXELES_POR_METRO).toFixed(1);
                const longitudReal = obj.longitudManual || metrosCalculados;

                // 2. Determinar Carga (Corriente) - Asumimos que el destino es la carga
                const carga = obj.destino.type === 'tablero' ? obj.origen : obj.destino;
                const corriente = carga.volt > 0 ? (carga.power / carga.volt) : 0;
                
                // 3. Fórmula Caída de Tensión (Monofásica/Bifásica simplificada: 2 * L * I * R / 1000)
                const resistencia = RESISTENCIA_AWG[obj.awg];
                const caidaVolts = (2 * longitudReal * corriente * resistencia) / 1000;
                const caidaPorcentaje = carga.volt > 0 ? (caidaVolts / carga.volt) * 100 : 0;

                const alerta = caidaPorcentaje > 3.0 ? 'alert' : '';
                const msjAlerta = caidaPorcentaje > 3.0 ? '<br><small>⚠️ Excede el 3% normativo. Sube el calibre.</small>' : '';

                propertiesPanel.innerHTML = `
                    <label>Conexión</label>
                    <div style="font-size:0.8rem; padding:8px; background:#111; border-radius:4px;">
                        ${obj.origen.name} ➔ ${obj.destino.name}
                    </div>

                    <label>Calibre del Conductor (AWG)</label>
                    <select id="propAwg">
                        <option value="14" ${obj.awg === "14" ? 'selected' : ''}>14 AWG (15A Max)</option>
                        <option value="12" ${obj.awg === "12" ? 'selected' : ''}>12 AWG (20A Max)</option>
                        <option value="10" ${obj.awg === "10" ? 'selected' : ''}>10 AWG (30A Max)</option>
                        <option value="8" ${obj.awg === "8" ? 'selected' : ''}>8 AWG (40A Max)</option>
                        <option value="6" ${obj.awg === "6" ? 'selected' : ''}>6 AWG (55A Max)</option>
                    </select>

                    <label>Longitud (Metros) [Plano: ${metrosCalculados}m]</label>
                    <input type="number" id="propLongitud" value="${longitudReal}" step="0.5" placeholder="Dejar vacío para auto">

                    <div class="result-box ${alerta}">
                        <strong>Carga:</strong> ${corriente.toFixed(2)} Amp<br>
                        <strong>Caída de Tensión:</strong> ${caidaVolts.toFixed(2)} V<br>
                        <strong>Porcentaje:</strong> ${caidaPorcentaje.toFixed(2)} % ${msjAlerta}
                    </div>
                    <button class="btn-tool" style="margin-top:10px; background:#f44336; border:none;" onclick="eliminarSeleccionado()">🗑️ Eliminar Cable</button>
                `;

                document.getElementById('propAwg').addEventListener('change', e => { obj.awg = e.target.value; actualizarPanelPropiedades(); });
                document.getElementById('propLongitud').addEventListener('input', e => { 
                    obj.longitudManual = parseFloat(e.target.value) || null; 
                    actualizarPanelPropiedades(); 
                });
            }
        }

        function eliminarSeleccionado() {
            if(!elementoSeleccionado) return;
            if(elementoSeleccionado.tipoObjeto === 'equipo') {
                // Eliminar equipo y cables conectados a él
                elementosCanvas = elementosCanvas.filter(e => e !== elementoSeleccionado);
                cablesCanvas = cablesCanvas.filter(c => c.origen !== elementoSeleccionado && c.destino !== elementoSeleccionado);
            } else {
                cablesCanvas = cablesCanvas.filter(c => c !== elementoSeleccionado);
            }
            seleccionar(null);
        }

        resizeCanvas();
    </script>
</body>
</html>
